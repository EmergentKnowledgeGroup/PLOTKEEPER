[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotkeeper"
version = "0.1.11"
description = "Read-only Codex Specswarm run ledger and review gate"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
plotkeeper = "plotkeeper.cli:main"

[tool.setuptools.packages.find]
include = ["plotkeeper*"]

[tool.setuptools.package-data]
plotkeeper = ["web/*.html", "web/*.css", "web/*.js"]
